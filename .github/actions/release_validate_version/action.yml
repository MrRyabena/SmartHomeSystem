name: Validate release version
description: Validate a release tag against versioned project files and required release notes assets.

inputs:
  tag:
    description: Release tag to validate.
    required: true
  workspace:
    description: Repository root directory.
    required: true
  log-level:
    description: Minimum log level for the validator.
    required: false
    default: INFO

outputs:
  valid:
    description: Whether the tag matches all expected versioned files.
    value: ${{ steps.validate.outputs.valid }}

runs:
  using: composite
  steps:
    - name: Validate tag against versioned files
      id: validate
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        if python3 ci/validate_version.py \
          --tag "$RELEASE_TAG" \
          --repo-root "${{ inputs.workspace }}" \
          --log-level "${{ inputs.log-level }}" \
          --summary-path "${GITHUB_STEP_SUMMARY:-}"; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
        fi
