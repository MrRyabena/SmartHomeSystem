name: Release assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archives
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -p release-assets

          zip -r "release-assets/SHScore.zip" "SHScore" >/dev/null
          zip -r "release-assets/SHSsettings.zip" "SHSsettings" >/dev/null
          zip -r "release-assets/SHSqt_core.zip" "SHSqt_core" >/dev/null

          shopt -s nullglob
          for module_dir in SHSlibrary/*/; do
            module_name="$(basename "${module_dir%/}")"
            zip -r "release-assets/SHSlibrary-${module_name}.zip" "$module_dir" >/dev/null
          done
          shopt -u nullglob

      - name: Upload archives to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            src/release-assets/SHScore.zip
            src/release-assets/SHSsettings.zip
            src/release-assets/SHSqt_core.zip
            src/release-assets/SHSlibrary-*.zip
