name: Validate release version

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  validate_version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag against versioned files
        id: validate
        uses: ./.github/actions/release_validate_version
        with:
          tag: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}

      - name: Stop invalid release tag
        if: ${{ steps.validate.outputs.valid != 'true' }}
        run: exit 1