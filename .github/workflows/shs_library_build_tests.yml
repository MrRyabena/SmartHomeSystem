name: SHS library tests
on:
    push:

    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up CMake
              uses: lukka/get-cmake@latest

            - name: Run build-test for ShsLibrary
              working-directory: src/SHSlibrary/tests
              run: |
                  chmod +x build_libraries_test.sh
                  ./build_libraries_test.sh

