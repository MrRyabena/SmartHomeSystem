[env]
framework = arduino
monitor_speed = 115200
lib_deps =     
    https://github.com/MrRyabena/SmartHomeSystem/releases/latest/download/SHScore.zip
global_build_flags = -D SHS_SF_UNUSE_SHS_SETTINGS

[env:esp8266]
platform = espressif8266
board = esp12e
upload_speed = 921600
build_type = release
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder
build_flags = ${env.global_build_flags}

[env:esp8266_debug]
platform = espressif8266
board = esp12e
upload_speed = 921600
build_type = debug
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder
build_flags = ${env.global_build_flags}
              -D SHS_SF_DEBUG

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = nodemcu-32s
upload_speed = 921600
build_type = release
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_flags = ${env.global_build_flags}

[env:esp32_debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = nodemcu-32s
upload_speed = 921600
build_type = debug
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_flags = ${env.global_build_flags}
              -D SHS_SF_DEBUG

[env:nano328]
platform = atmelavr
board = nanoatmega328
build_flags = ${env.global_build_flags}

[env:nano328_debug]
platform = atmelavr
board = nanoatmega328
build_flags = ${env.global_build_flags}
              -D SHS_SF_DEBUG
